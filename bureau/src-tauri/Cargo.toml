[package]
name = "speed-express-operations"
version = "0.1.0"
description = "Speed Express Operations — l'application de bureau de l'équipe"
authors = ["Speed Express Shipping"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "ses_operations_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-updater = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
