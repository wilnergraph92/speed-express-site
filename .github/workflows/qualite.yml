name: Qualité du site
on:
  pull_request:
  push:
    branches-ignore: [main]
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  valider:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # Tout l'historique : les essais « production » rejouent les fichiers SQL tels qu'ils étaient avant chaque mise à jour
      # (git show <commit>:fichier). Sans lui, ils ne pourraient éprouver que l'installation neuve.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # Les essais sur un VRAI PostgreSQL (noyau 001 à 013, sauvegarde de bout en bout, rôles en WASM) tournent ici aussi : une mise en
      # ligne n'a lieu que s'ils passent. Tout est jetable (bases créées dans le dossier temporaire du runner) ; aucun secret, aucune base réelle.
      - name: PostgreSQL et age pour les essais (binaires seulement, rien n'est démarré)
        run: |
          sudo apt-get update -y
          sudo apt-get install -y age
          D=$(ls -d /usr/lib/postgresql/*/bin 2>/dev/null | sort -V | tail -1)
          if [ -z "$D" ]; then sudo apt-get install -y postgresql; D=$(ls -d /usr/lib/postgresql/*/bin | sort -V | tail -1); fi
          "$D/postgres" --version
          echo "SES_PG_BIN=$D" >> "$GITHUB_ENV"
      - name: Dépendances des essais WASM (hors dépôt, version épinglée)
        run: |
          npm install --prefix "$RUNNER_TEMP/deps" --no-save --no-audit --no-fund @electric-sql/pglite@0.5.8
          echo "SES_TEST_DEPS=$RUNNER_TEMP/deps" >> "$GITHUB_ENV"
      - name: HTML, liens, ancres, syntaxe JS, i18n, tests métier et essais PostgreSQL
        run: bash outils/tests/verifier.sh
      - name: Régénération reproductible (les 28 pages, les en-têtes, le plan du site)
        run: |
          python3 outils/mise-en-page.py
          git diff --exit-code -- '*.html' assets/css _headers sitemap.xml
          # Aucun fichier modifié ni ajouté par la génération ou par les essais (hors fichiers ignorés).
          test -z "$(git status --porcelain)" || { git status --porcelain; echo 'La génération ou un essai a modifié le dépôt.'; exit 1; }
      - name: Nature de la modification (migrations, site, mobile, outillage)
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git diff --name-only "$BASE_SHA"...HEAD > fichiers.txt
          {
            echo '## Nature de cette modification'
            echo
            echo "- Migrations SQL (à coller à la main, après sauvegarde) : $(grep -cE '^outils/(supabase[^/]*|logistique/[^/]*)\.sql$' fichiers.txt || true)"
            echo "- Site publié (pages, scripts, styles, images) : $(grep -cvE '^(outils|docs|scripts|\.github|\.claude)/|^(README|CLAUDE|SECURITY|ARCHITECTURE-BASELINE)\.md$|^\.gitignore$' fichiers.txt || true)"
            echo "- Préproduction (outils/staging) : $(grep -c '^outils/staging/' fichiers.txt || true)"
            echo "- Tests et outillage : $(grep -cE '^outils/(tests|[^/]*\.py)|^scripts/' fichiers.txt || true)"
            echo "- Chaîne de publication (.github) : $(grep -c '^\.github/' fichiers.txt || true)"
            echo "- Documentation : $(grep -cE '^docs/|\.md$' fichiers.txt || true)"
            echo
            if grep -qE '^outils/(supabase[^/]*|logistique/[^/]*)\.sql$' fichiers.txt; then
              echo '> ⚠️ Cette PR contient une migration : la fusionner NE l'\''applique PAS. Elle se colle à la main, après une sauvegarde vérifiée, d'\''abord en préproduction.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          rm fichiers.txt
