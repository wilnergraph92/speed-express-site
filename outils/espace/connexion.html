<main id="top" style="background:var(--smoke);padding:clamp(30px,4.5vw,58px) 26px clamp(54px,7vw,92px)">
  <div style="max-width:560px;margin:0 auto">

    <div class="ses-carte" data-ses-reveal="0" style="background:#fff;border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:0 34px 64px -46px rgba(11,12,14,.5)">
      <div style="position:relative;background:var(--ink);color:#fff;padding:clamp(24px,3.6vw,34px) clamp(22px,3.4vw,32px);overflow:hidden">
        <div style="position:absolute;top:0;left:0;width:clamp(86px,16%,140px);height:6px;background:var(--red)"></div>
        <span style="font-family:'IBM Plex Mono',monospace;font-size:11.5px;letter-spacing:.2em;color:#e7eaef">ESPACE CLIENT</span>
        <h1 style="margin-top:12px;font-size:clamp(26px,3.8vw,36px);line-height:1.1;color:#fff">Se connecter</h1>
        <p style="margin-top:8px;font-size:15.5px;color:#c9cfd8">Vos colis, leurs statuts et vos factures, au même endroit.</p>
      </div>

      <div style="padding:clamp(22px,3.4vw,34px)">
        <p id="ses-mode" hidden></p>

        <form id="ses-connexion" novalidate autocomplete="on">
          <div id="ses-message" hidden style="margin-bottom:20px"></div>

          <label class="ses-champ">
            <span>E-mail<i>*</i></span>
            <input type="email" name="email" required maxlength="160" autocomplete="email" placeholder="Entrez votre e-mail">
          </label>

          <label class="ses-champ" style="margin-top:16px">
            <span>Mot de passe<i>*</i></span>
            <span style="position:relative;display:block">
              <input type="password" name="motDePasse" required maxlength="100" autocomplete="current-password" placeholder="Entrez votre mot de passe" style="padding-right:96px">
              <button type="button" class="ses-voir-mdp" aria-pressed="false">Afficher</button>
            </span>
          </label>

          <button type="submit" class="ses-bouton ses-bouton-principal" style="width:100%;margin-top:24px;padding:17px 24px;font-size:15.5px">Se connecter</button>

          <p style="margin-top:16px;text-align:center;font-size:14.5px">
            <button type="button" id="ses-oubli" class="ses-lien">Mot de passe oublié ?</button>
          </p>
          <p style="margin-top:14px;text-align:center;font-size:15px;color:#4b5563">Pas encore de compte ? <a href="creer-un-compte.html" style="font-weight:800">Créer un compte</a></p>
        </form>
      </div>
    </div>

    <p data-ses-reveal="1" style="margin-top:22px;text-align:center;font-size:14px;color:#6b7280">Vous cherchez un colis sans être inscrit ? Utilisez le <a href="suivi.html">suivi par numéro</a>.</p>
  </div>
</main>

<template data-textes>
  <span data-t="afficher">Afficher</span>
  <span data-t="masquer">Masquer</span>
  <span data-t="attente">Connexion…</span>
  <span data-t="oubli-demande">Indiquez votre adresse e-mail, puis cliquez de nouveau sur « Mot de passe oublié ».</span>
  <span data-t="oubli-envoye">Un lien de réinitialisation vient de partir vers {email}. Ouvrez-le depuis cet appareil ou un autre.</span>
  <span data-t="champ-requis">Ce champ est obligatoire.</span>
  <span data-t="email-invalide">Cette adresse e-mail ne semble pas valide.</span>
  <span data-t="mode-demo">Mode démonstration : les comptes de cet ordinateur seulement. Compte d'essai administrateur : admin@speedexpress.demo / speed2026</span>
  <span data-t="mode-off">L'espace client n'est pas encore ouvert. Écrivez-nous sur WhatsApp.</span>
  <span data-t="erreur-identifiants">E-mail ou mot de passe incorrect.</span>
  <span data-t="erreur-email-existe">Un compte existe déjà avec cette adresse e-mail.</span>
  <span data-t="erreur-email-invalide">Cette adresse e-mail ne semble pas valide.</span>
  <span data-t="erreur-demo-sans-email">En mode démonstration, aucun e-mail ne peut partir. Recréez un compte ou utilisez le compte d'essai.</span>
  <span data-t="erreur-reseau">La connexion a échoué. Vérifiez votre accès à Internet, puis réessayez.</span>
  <span data-t="erreur-ferme">L'espace client n'est pas encore ouvert.</span>
  <span data-t="erreur-trop-de-demandes">Trop de tentatives. Patientez quelques minutes avant de réessayer.</span>
  <span data-t="erreur-non-autorise">Cette action ne vous est pas permise.</span>
  <span data-t="erreur-inconnu">Une erreur est survenue. Réessayez dans un instant.</span>
</template>
